# Production-like CI/CD pipeline (manual) + CodeQL
# - Manual dispatch only (won't run automatically on push/PR)
# - Jobs: lint, format-check, unit-tests, integration-tests (placeholder), build, package, deploy (guarded), codeql
# - Deploy runs only when you manually dispatch the workflow with deploy: "true"
name: "Production-like CI/CD Pipeline (manual) & CodeQL"

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Set to "true" to run the deploy job (default: false)'
        required: false
        default: 'false'

concurrency:
  group: "prod-like-pipeline-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  lint:
    name: Lint (JS/Python safe-detection)
    runs-on: ubuntu-latest
    outputs:
      lint-result: ${{ steps.lint-step.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (for JS linting if present)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python (for py linting if present)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run linters if found
        id: lint-step
        run: |
          set -e
          RESULT="skipped"
          # JavaScript/TypeScript lint
          if [ -f package.json ]; then
            if node -e "try{const p=require('./package.json'); console.log(Boolean(p.scripts && p.scripts.lint))}catch(e){console.log(false)}" | grep -q true; then
              echo "Running npm lint..."
              npm ci --no-audit --no-fund
              npm run lint
              RESULT="js-lint-passed"
            else
              echo "No npm lint script; skipping JS lint."
            fi
          else
            echo "No package.json; skipping JS lint."
          fi

          # Python lint (flake8) if pyproject.toml or requirements.txt or setup.py
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            echo "Running Python lint (installing flake8)..."
            python -m pip install --upgrade pip
            python -m pip install flake8
            # run flake8, but don't fail the whole workflow if there are lint issues; they should be fixed in CI later
            if flake8 .; then
              RESULT="py-lint-passed"
            else
              echo "flake8 found issues"
              RESULT="py-lint-failed"
              # Keep job failing to indicate lint problems; comment out next line to make lint non-blocking:
              exit 1
            fi
          else
            echo "No Python project files found; skipping Python lint."
          fi

          echo "::set-output name=result::$RESULT"

  format-check:
    name: Format check (prettier/black)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node & Python
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run formatter checks
        run: |
          # JS/TS prettier check
          if [ -f package.json ]; then
            if node -e "try{const p=require('./package.json'); console.log(Boolean(p.scripts && (p.scripts.format || p.scripts.prettier)))}catch(e){console.log(false)}" | grep -q true; then
              echo "Running npm format check..."
              npm ci --no-audit --no-fund
              if npm run format --silent -- --check; then
                echo "Prettier/format check passed."
              else
                echo "Format check failed. Please run npm run format locally to fix."
                exit 1
              fi
            else
              echo "No JS format script; skipping."
            fi
          fi

          # Python black check
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            python -m pip install --upgrade pip
            python -m pip install black
            if python -m black --check .; then
              echo "Black check passed."
            else
              echo "Black check failed. Run 'black .' to reformat."
              exit 1
            fi
          fi

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: format-check
    outputs:
      tests-passed: ${{ steps.test-step.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run unit tests (JS or Python if detected)
        id: test-step
        run: |
          set -e
          RESULT="skipped"
          if [ -f package.json ]; then
            if node -e "try{const p=require('./package.json'); console.log(Boolean(p.scripts && p.scripts.test))}catch(e){console.log(false)}" | grep -q true; then
              echo "Running npm test..."
              npm ci --no-audit --no-fund
              npm test
              RESULT="js-tests-passed"
            else
              echo "No npm test script; skipping JS tests."
            fi
          fi

          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            echo "Running Python tests with pytest if available..."
            python -m pip install --upgrade pip
            python -m pip install pytest
            if pytest -q; then
              RESULT="py-tests-passed"
            else
              echo "Pytest failed"
              exit 1
            fi
          fi

          echo "::set-output name=result::$RESULT"

  integration-tests:
    name: Integration tests (placeholder)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integration tests placeholder
        run: |
          # Replace the following with real integration test commands or orchestration
          echo "Integration tests placeholder: no external services will be started."
          echo "If you want real integration tests, add DB/services setup steps here."

  build:
    name: Build / Compile
    runs-on: ubuntu-latest
    needs: integration-tests
    outputs:
      build-artifact-path: ${{ steps.package.outputs.artifact-path || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment (Node/Python)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Build (JS or Python)
        run: |
          set -e
          if [ -f package.json ] && node -e "try{const p=require('./package.json'); console.log(Boolean(p.scripts && p.scripts.build))}catch(e){console.log(false)}" | grep -q true; then
            echo "Running npm build..."
            npm ci --no-audit --no-fund
            npm run build
            echo "JS build complete"
          elif [ -f setup.py ]; then
            echo "Building Python package (sdist/wheel)..."
            python -m pip install --upgrade pip setuptools wheel
            python setup.py sdist bdist_wheel
            echo "Python build complete"
          else
            echo "No recognizable build script; nothing to build."
          fi

      - name: Package build output as artifact
        id: package
        run: |
          ARTPATH="dist"
          if [ -d "$ARTPATH" ]; then
            echo "artifact-path=$ARTPATH" >> "$GITHUB_OUTPUT"
            tar -czf build-artifact.tar.gz -C "$ARTPATH" .
            echo "Created build-artifact.tar.gz"
          else
            echo "artifact-path=" >> "$GITHUB_OUTPUT"
            echo "No dist directory found; nothing packaged."
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            build-artifact.tar.gz
            dist

  package:
    name: Package (release candidate)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./package_output || true

      - name: Create release candidate metadata
        run: |
          mkdir -p release_candidate
          echo "ref=${GITHUB_REF}" > release_candidate/metadata.txt
          echo "sha=${GITHUB_SHA}" >> release_candidate/metadata.txt
          tar -czf release-candidate.tar.gz release_candidate || true

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-candidate.tar.gz

  codeql:
    name: CodeQL analysis (${{ matrix.language }})
    needs: unit-tests
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Add custom query packs here if desired
          queries: security-and-quality

      - name: Placeholder build for CodeQL (if your language requires it)
        run: |
          echo "CodeQL placeholder build; replace with actual build commands if required."
          sleep 1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  deploy:
    name: Deploy to production (guarded)
    runs-on: ubuntu-latest
    needs: package
    if: ${{ github.event.inputs.deploy == 'true' }}
    environment:
      name: production
      # environment protection rules can enforce approvals in GitHub UI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm deploy intent
        run: |
          echo "Deploying to production (placeholder)."
          echo "This step only runs when you dispatch the workflow with deploy: 'true'."
          echo "Replace this with your real deployment commands (kubectl/helm, cloud provider CLI, etc)."

      - name: Deployment placeholder
        run: |
          # Example: echo deploy command (DO NOT perform production changes in this template)
          echo "DRY RUN: deploy command would run here"
