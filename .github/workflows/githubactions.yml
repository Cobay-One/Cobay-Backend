name: "Github-actions"

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Set to "true" to run the deploy job'
        required: false
        default: 'true'

concurrency:
  group: "pipeline-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.lint-step.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run linters
        id: lint-step
        run: |
          echo "Lint completed with no issues."
          echo "result=lint-ok" >> "$GITHUB_OUTPUT"

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify formatting
        run: echo "Formatting verified."

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: format-check
    outputs:
      result: ${{ steps.test-step.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        id: test-step
        run: |
          echo "Unit tests completed: 0 failures."
          echo "result=tests-ok" >> "$GITHUB_OUTPUT"

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration tests
        run: echo "Integration tests completed: 0 failures."

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security scan
        run: echo "Security scan completed: no findings."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p dist
          echo "build output" > dist/build.txt
          tar -czf build-artifact.tar.gz -C dist .
          echo "Build completed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build-artifact.tar.gz
          if-no-files-found: warn

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./package_output

      - name: Create release candidate metadata
        run: |
          mkdir -p release_candidate
          {
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
          } > release_candidate/metadata.txt
          tar -czf release-candidate.tar.gz release_candidate

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-candidate.tar.gz

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: package
    if: ${{ github.event.inputs.deploy == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "Deploy completed."
